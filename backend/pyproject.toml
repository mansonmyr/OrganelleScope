[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organellescope-backend"
version = "0.1.6.dev0"
description = "Calibrated microscopy import and analysis for OrganelleScope"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3",
  "tifffile>=2025.10.4,<2027", "pillow>=10,<13", "python-multipart>=0.0.18,<1",
  "pydantic>=2.10,<3", "imagecodecs>=2025.3.30,<2027", "scipy>=1.13,<2", "certifi>=2025.1.31"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["organelle_scope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
