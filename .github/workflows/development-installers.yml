name: Unsigned development installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
          - os: macos-14
            flags: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "backend[test]" pyinstaller
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: python -m pytest backend/tests -q
      - run: npm test --prefix frontend
      - run: npm run build:ui
      - run: npm run build:backend
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-development-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
