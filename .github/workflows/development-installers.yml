name: Desktop installers and release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            label: windows-x64
            flags: --win --x64
          - os: macos-14
            architecture: arm64
            label: macos-arm64
            flags: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -e "backend[test]" pyinstaller
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: python -m pytest backend/tests -q
      - run: python -m unittest discover -s scripts/tests -v
      - run: npm test --prefix frontend
      - run: npm run build:ui
      - run: npm run build:backend
      - run: python scripts/smoke-frozen.py
      - run: python scripts/dependency-notices.py
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'macOS'
        run: python scripts/verify-macos-installer.py --output release/installer-check-macos-arm64.json
      - run: python scripts/prepare-release-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.json
            release/dependency-notices-*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - run: python scripts/publish-release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
