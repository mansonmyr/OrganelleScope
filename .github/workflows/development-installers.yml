name: Unsigned development installers
on:
  workflow_dispatch:
    inputs:
      restoration:
        description: Include the CAREamics CPU restoration runtime (larger installer)
        type: boolean
        default: true
  push:
    tags:
      - 'v*-dev*'
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
          - os: macos-14
            flags: --mac --arm64
    runs-on: ${{ matrix.os }}
    env:
      ORGANELLESCOPE_INCLUDE_RESTORATION: ${{ (github.event_name != 'workflow_dispatch' || inputs.restoration) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "backend[test]" pyinstaller
      - if: env.ORGANELLESCOPE_INCLUDE_RESTORATION == '1' && runner.os == 'Windows'
        run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - if: env.ORGANELLESCOPE_INCLUDE_RESTORATION == '1'
        run: python -m pip install -e "backend[restoration]"
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: python -m pytest backend/tests -q
      - run: npm test --prefix frontend
      - run: python scripts/dependency-notices.py
      - run: npm run build:ui
      - run: npm run build:backend
      - run: python scripts/smoke-frozen.py
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: python scripts/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-development-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
